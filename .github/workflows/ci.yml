name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # node-version-file (not a bare "22") is what actually enforces the
      # >=22.12 floor required by sanity 6 / @sanity/ui 4.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates apps/sanity/extract.json and the site's types.gen.ts, both of
      # which are derived artifacts and therefore gitignored. Runs before
      # typecheck because the site imports the generated types.
      - name: Typegen
        run: pnpm typegen
        env:
          SANITY_STUDIO_PROJECT_ID: hfh83o0w
          SANITY_STUDIO_DATASET: production

      - name: Lint (site)
        run: pnpm --filter @codingcatdev/site lint

      - name: Typecheck (site)
        run: pnpm --filter @codingcatdev/site typecheck

      - name: Typecheck (studio)
        run: pnpm --filter @codingcatdev/sanity exec tsc --noEmit

      - name: Build site
        run: pnpm --filter @codingcatdev/site build

      - name: Build studio
        run: pnpm --filter @codingcatdev/sanity build
        env:
          SANITY_STUDIO_PROJECT_ID: hfh83o0w
          SANITY_STUDIO_DATASET: production

      # extract.json is committed and is the single source of truth for typegen.
      # The Typegen step above regenerates it; if that changed the file, the
      # commit is stale. This is what stopped three divergent copies before.
      - name: Verify extract.json is current
        run: |
          if ! git diff --quiet -- apps/sanity/extract.json; then
            echo "::error::apps/sanity/extract.json is stale. Run 'pnpm typegen' and commit the result."
            git diff --stat -- apps/sanity/extract.json
            exit 1
          fi

  preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Sanity Types
        run: pnpm typegen
        env:
          SANITY_STUDIO_PROJECT_ID: hfh83o0w
          SANITY_STUDIO_DATASET: dev

      - name: Build site (preview)
        run: pnpm --filter @codingcatdev/site build

      - name: Upload Cloudflare Worker Preview Version
        id: upload_preview
        run: |
          OUTPUT=$(pnpm --filter @codingcatdev/site exec wrangler versions upload --tag "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}")
          echo "$OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c46bd0f3b9ed47b8692cca098030edbf' }}

