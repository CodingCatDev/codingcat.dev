name: Nightly Dataset Sync (production -> dev)

on:
  schedule:
    - cron: "0 4 * * *" # Every day at 04:00 UTC
  workflow_dispatch:

jobs:
  sync-dataset:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync production dataset to dev
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID || 'hfh83o0w' }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          PROJECT_ID="${SANITY_STUDIO_PROJECT_ID:-hfh83o0w}"
          API_HOST="https://api.sanity.io"
          API_VERSION="v2021-06-07"

          echo "Ensuring 'dev' dataset exists (public ACL)..."
          curl -s -X PUT "$API_HOST/$API_VERSION/projects/$PROJECT_ID/datasets/dev" \
            -H "Authorization: Bearer $SANITY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"aclMode":"public"}' || true

          echo "Exporting 'production' dataset..."
          pnpm --filter @codingcatdev/sanity exec sanity dataset export production /tmp/production.tar.gz --overwrite

          echo "Importing into 'dev' dataset (--replace)..."
          pnpm --filter @codingcatdev/sanity exec sanity dataset import /tmp/production.tar.gz dev --replace

          echo "Dataset sync completed successfully!"
