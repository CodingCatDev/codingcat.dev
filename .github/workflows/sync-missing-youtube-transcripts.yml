name: Sync Missing YouTube Transcripts

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Target Sanity Dataset"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - dev

jobs:
  sync-transcripts:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Missing YouTube Transcripts Sync
        run: |
          pnpm exec sanity functions test sync-missing-youtube-transcripts --dataset ${{ inputs.dataset }}
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ inputs.dataset }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
