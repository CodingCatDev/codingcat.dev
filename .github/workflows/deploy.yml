              'https://sanity.io',
              'https://codingcat.dev',
              'https://dev.codingcat.dev'
            ];
            (async () => {
              const res = await fetch('https://api.sanity.io/v2021-06-07/projects/' + process.env.SANITY_STUDIO_PROJECT_ID + '/cors', {
