          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}

      - name: Deploy Sanity Studio
        run: npx sanity deploy -y
        working-directory: apps/sanity
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_HOSTNAME: ${{ vars.SANITY_STUDIO_HOSTNAME }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}

      - name: Deploy Sanity Ops App (Sanity App SDK)
        working-directory: apps/ops
        run: |
          ORG_ID=$(node -e "
            fetch('https://api.sanity.io/v2021-06-07/projects/${{ vars.SANITY_STUDIO_PROJECT_ID }}', {
              headers: { Authorization: 'Bearer ' + process.env.SANITY_AUTH_TOKEN }
            })
            .then(r => r.json())
            .then(d => {
              if (!d.organizationId) throw new Error('No organizationId in project response');
              console.log(d.organizationId);
            })
            .catch(err => { console.error(err); process.exit(1); });
          ")
          export SANITY_ORGANIZATION_ID="$ORG_ID"
          if [ "${{ vars.SANITY_STUDIO_DATASET }}" = "dev" ]; then
