name: Syndicate Post

on:
  workflow_dispatch:
    inputs:
      document_id:
        description: "Sanity Document ID to syndicate"
        required: true
        default: "05eda048-efff-4e0f-8b76-83a2f482fa13"
        type: string
      dataset:
        description: "Target Sanity Dataset"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - dev

jobs:
  syndicate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syndicate Post
        run: |
          if [ "$TARGET_DOCUMENT_ID" = "backfill-dailydev" ]; then
            node scripts/backfill-dailydev-and-links.mjs
          elif [ "$TARGET_DOCUMENT_ID" = "enrich-aeo-seo" ]; then
            SANITY_STUDIO_DATASET=production node scripts/enrich-all-posts-aeo-seo-links.mjs
            SANITY_STUDIO_DATASET=dev node scripts/enrich-all-posts-aeo-seo-links.mjs
          elif [ "$TARGET_DOCUMENT_ID" = "trend-radar" ]; then
            SANITY_STUDIO_DATASET=production node scripts/run-trend-radar.mjs
            SANITY_STUDIO_DATASET=dev node scripts/run-trend-radar.mjs
          elif [ "$TARGET_DOCUMENT_ID" = "firebase-archive-2025-2026" ]; then
            FIREBASE_ARCHIVE_YEARS=2025,2026 SANITY_STUDIO_DATASET=production node scripts/generate-firebase-archive-posts.mjs
            FIREBASE_ARCHIVE_YEARS=2025,2026 SANITY_STUDIO_DATASET=dev node scripts/generate-firebase-archive-posts.mjs
          elif [ "$TARGET_DOCUMENT_ID" = "firebase-archive-2017-2024" ]; then
            FIREBASE_ARCHIVE_YEARS=2017,2018,2019,2020,2021,2022,2023,2024 SANITY_STUDIO_DATASET=production node scripts/generate-firebase-archive-posts.mjs
            FIREBASE_ARCHIVE_YEARS=2017,2018,2019,2020,2021,2022,2023,2024 SANITY_STUDIO_DATASET=dev node scripts/generate-firebase-archive-posts.mjs
          else
            node scripts/run-syndicate-post.mjs
          fi
        env:
          TARGET_DOCUMENT_ID: ${{ inputs.document_id }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID || 'hfh83o0w' }}
          SANITY_STUDIO_DATASET: ${{ inputs.dataset || 'production' }}
          PRIVATE_DEVTO: ${{ secrets.PRIVATE_DEVTO }}
          PRIVATE_HASHNODE: ${{ secrets.PRIVATE_HASHNODE }}
          DEVTO_API_KEY: ${{ secrets.PRIVATE_DEVTO }}
          HASHNODE_ACCESS_TOKEN: ${{ secrets.PRIVATE_HASHNODE }}
          AWS_BUILDER_SESSION_TOKEN: ${{ secrets.AWS_BUILDER_SESSION_TOKEN }}
          DAILY_DEV_TOKEN: ${{ secrets.DAILY_DEV_TOKEN }}
          DAILY_DEV_SESSION_COOKIE: ${{ secrets.DAILY_DEV_SESSION_COOKIE }}
          REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
          GOOGLE_WORKSPACE_REFRESH_TOKEN: ${{ secrets.GOOGLE_WORKSPACE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
